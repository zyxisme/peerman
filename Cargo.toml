[package]
name = "peerman"
version = "0.1.8"
edition = "2021"
description = "DN42 peer manager with WireGuard, BIRD, and cluster support"
license = "MIT"
repository = "https://github.com/zyxisme/peerman"
documentation = "https://docs.rs/peerman"
readme = "README.md"
keywords = ["dn42", "wireguard", "bird", "networking", "vpn"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# gRPC
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"
prost = "0.13"

# Web + static files
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
rust-embed = "8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"

# Cryptography (WireGuard key generation)
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
regex = "1"
dashmap = "6"
futures = "0.3"
jsonwebtoken = "9"
argon2 = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tonic-build = "0.12"
